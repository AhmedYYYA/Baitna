openapi: 3.1.2
info:
  title: BAITNA Lifecycle API — Proposed Contract
  version: 0.1.0-design
  description: >-
    Design only. No service is deployed. All resources require server-side
    object-level authorization. Home ID is not a legal property title.
servers:
  - url: http://127.0.0.1:4100/api/v1
    description: Proposed isolated local development server, not running yet.
security:
  - bearerAuth: []
tags:
  - name: Homes
  - name: Projects
  - name: Contracts
  - name: Scopes
  - name: Schedules
  - name: Transfer
paths:
  /homes:
    get:
      tags: [Homes]
      operationId: listMyHomes
      summary: List only homes accessible to the authenticated actor.
      responses:
        '200':
          description: Accessible homes; never all homes in the database.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Home' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Homes]
      operationId: createHome
      summary: Create permanent Home ID and initial owner_manager grant atomically.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHome' }
      responses:
        '201':
          description: Home created; Home ID generated server-side.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /homes/{homeId}:
    parameters:
      - $ref: '#/components/parameters/HomeId'
    get:
      tags: [Homes]
      operationId: getHome
      summary: Get one home after authorizing current home grants.
      responses:
        '200':
          description: Authorized Home
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Home' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /homes/{homeId}/projects:
    parameters:
      - $ref: '#/components/parameters/HomeId'
    get:
      tags: [Projects]
      operationId: listHomeProjects
      responses:
        '200':
          description: Authorized projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
    post:
      tags: [Projects]
      operationId: createProject
      description: Requires an active owner_manager or owner_delegate grant.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProject' }
      responses:
        '201':
          description: New project under existing Home ID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/contracts:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Contracts]
      operationId: listContracts
      responses:
        '200':
          description: Contracts available to caller under project-specific policy.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contract' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
    post:
      tags: [Contracts]
      operationId: createContract
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContract' }
      responses:
        '201':
          description: Created draft Contract.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contract' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /contracts/{contractId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ContractId'
    post:
      tags: [Contracts]
      operationId: createContractRevision
      description: Creates new draft; never overwrites an approved revision.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContractRevisionInput' }
      responses:
        '201':
          description: New draft revision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionRef' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /contracts/{contractId}/revision-approvals:
    parameters:
      - $ref: '#/components/parameters/ContractId'
    post:
      tags: [Contracts]
      operationId: approveContractRevision
      description: Role-gated approval; does not create a legal electronic signature by itself.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionApproval' }
      responses:
        '200':
          description: Server-authorized approval with audit event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionRef' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /projects/{projectId}/sows:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Scopes]
      operationId: listSows
      responses:
        '200':
          description: Authorized SOWs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sow' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
    post:
      tags: [Scopes]
      operationId: createSow
      description: Governing contract must belong to the same project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSow' }
      responses:
        '201':
          description: Created SOW.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sow' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /sows/{sowId}/revisions:
    parameters:
      - $ref: '#/components/parameters/SowId'
    post:
      tags: [Scopes]
      operationId: createSowRevision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SowRevisionInput' }
      responses:
        '201':
          description: Draft SOW revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionRef' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /sows/{sowId}/revision-approvals:
    parameters:
      - $ref: '#/components/parameters/SowId'
    post:
      tags: [Scopes]
      operationId: approveSowRevision
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionApproval' }
      responses:
        '200':
          description: Approved SOW revision after authorization and audit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionRef' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /projects/{projectId}/wbs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Scopes]
      operationId: createWbsNode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWbsNode' }
      responses:
        '201': { description: WBS node created under authorized project and SOW. }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /projects/{projectId}/boq:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Scopes]
      operationId: createBoqLine
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoqLine' }
      responses:
        '201': { description: BOQ line created and scoped to the WBS node. }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /projects/{projectId}/ims:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Schedules]
      operationId: getMasterIms
      responses:
        '200':
          description: Exactly one IMS per project with current baseline revision (if approved).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ims' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
    put:
      tags: [Schedules]
      operationId: ensureMasterIms
      summary: Create master IMS if absent; idempotent for same project.
      responses:
        '200':
          description: Existing IMS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ims' }
        '201':
          description: Created IMS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ims' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /ims/{imsId}/revisions:
    parameters:
      - $ref: '#/components/parameters/ImsId'
    post:
      tags: [Schedules]
      operationId: createImsRevision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateImsRevision' }
      responses:
        '201':
          description: New draft version; old baseline preserved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevisionRef' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
  /ims-revisions/{revisionId}/activities:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    post:
      tags: [Schedules]
      operationId: addImsActivity
      description: Refuses mutation of approved revision; WBS must match project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivity' }
      responses:
        '201': { description: Activity created. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /ims-revisions/{revisionId}/dependencies:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    post:
      tags: [Schedules]
      operationId: addImsDependency
      description: Prevent cycles and cross-revision links. FS/SS/FF/SF + lag supported.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDependency' }
      responses:
        '201': { description: Dependency created. }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /ims/{imsId}/baseline-approvals:
    parameters:
      - $ref: '#/components/parameters/ImsId'
    post:
      tags: [Schedules]
      operationId: approveImsBaseline
      description: >-
        Transaction validates approved actor, revision scope, DAG, dates,
        append-only audit, then points IMS to this immutable baseline revision.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevisionApproval' }
      responses:
        '200':
          description: New current baseline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ims' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }
  /homes/{homeId}/transfer-requests:
    parameters:
      - $ref: '#/components/parameters/HomeId'
    post:
      tags: [Transfer]
      x-release-phase: P2
      operationId: requestDigitalRecordManagementTransfer
      description: >-
        Future design only. Transfers BAITNA manager permissions and permitted
        technical passport information; never transfers legal property title.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransferInitiation' }
      responses:
        '202': { description: Pending consent and entitlement verification; not completed. }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/HiddenNotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-verifiable OIDC issuer/audience/signature/expiry (identity provider not selected).
  parameters:
    HomeId:
      name: homeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContractId:
      name: contractId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SowId:
      name: sowId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImsId:
      name: imsId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 12, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string, minLength: 1 }
  responses:
    Unauthorized:
      description: Missing or invalid identity
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    HiddenNotFound:
      description: Missing resource or resource not visible to caller (no enumeration).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: State conflict, duplicate, or concurrent mutation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    InvalidInput:
      description: Invalid lifecycle or cross-project reference.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    UUID:
      type: string
      format: uuid
    Home:
      type: object
      required: [id, homeRef, label, lifecyclePhase, recordVersion, createdAt]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        homeRef: { type: string, pattern: '^BT-H-[A-F0-9]{32}$', readOnly: true }
        label: { type: string }
        lifecyclePhase:
          type: string
          enum: [planning, construction, handover, operation, renovation, archived]
        recordVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
    CreateHome:
      type: object
      required: [label]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 160 }
    Project:
      type: object
      required: [id, homeId, projectRef, name, projectKind, status, recordVersion]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        homeId: { $ref: '#/components/schemas/UUID' }
        projectRef: { type: string }
        name: { type: string }
        projectKind: { type: string, enum: [new_build, renovation, maintenance, extension] }
        status: { type: string, enum: [draft, active, suspended, handover, closed] }
        recordVersion: { type: integer, minimum: 1 }
    CreateProject:
      type: object
      required: [projectRef, name, projectKind]
      additionalProperties: false
      properties:
        projectRef: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 1, maxLength: 160 }
        projectKind: { type: string, enum: [new_build, renovation, maintenance, extension] }
    Contract:
      type: object
      required: [id, projectId, contractRef, status]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        projectId: { $ref: '#/components/schemas/UUID' }
        contractRef: { type: string }
        status: { type: string, enum: [draft, in_review, active, closed, cancelled] }
    CreateContract:
      type: object
      required: [contractRef, counterpartyLabel]
      additionalProperties: false
      properties:
        contractRef: { type: string, minLength: 1 }
        counterpartyLabel: { type: string, minLength: 1 }
    ContractRevisionInput:
      type: object
      required: [revisionNumber, terms]
      properties:
        revisionNumber: { type: integer, minimum: 1 }
        terms: { type: object, additionalProperties: true }
        sourceDocumentId: { $ref: '#/components/schemas/UUID' }
    RevisionRef:
      type: object
      required: [id, revisionNumber, state]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        revisionNumber: { type: integer, minimum: 1 }
        state: { type: string, enum: [draft, submitted, approved, rejected] }
        approvedAt: { type: [string, 'null'], format: date-time }
    RevisionApproval:
      type: object
      required: [revisionId, approvalReason]
      additionalProperties: false
      properties:
        revisionId: { $ref: '#/components/schemas/UUID' }
        approvalReason: { type: string, minLength: 1 }
    Sow:
      type: object
      required: [id, projectId, contractId, sowRef, title]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        projectId: { $ref: '#/components/schemas/UUID' }
        contractId: { $ref: '#/components/schemas/UUID' }
        sowRef: { type: string }
        title: { type: string }
        incorporationStatus:
          type: string
          enum: [not_incorporated, incorporated, superseded]
    CreateSow:
      type: object
      required: [contractId, sowRef, title]
      additionalProperties: false
      properties:
        contractId: { $ref: '#/components/schemas/UUID' }
        sowRef: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
    SowRevisionInput:
      type: object
      required: [revisionNumber, specification, acceptanceCriteria]
      properties:
        revisionNumber: { type: integer, minimum: 1 }
        specification: { type: object, additionalProperties: true }
        acceptanceCriteria:
          type: array
          items: { type: object, additionalProperties: true }
    CreateWbsNode:
      type: object
      required: [wbsCode, title]
      properties:
        wbsCode: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        sowId: { $ref: '#/components/schemas/UUID' }
        parentId: { $ref: '#/components/schemas/UUID' }
    CreateBoqLine:
      type: object
      required: [wbsNodeId, lineRef, description, quantity, unit, unitPrice]
      properties:
        wbsNodeId: { $ref: '#/components/schemas/UUID' }
        lineRef: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        quantity: { type: string, pattern: '^[0-9]+(\.[0-9]{1,4})?$' }
        unit: { type: string, minLength: 1 }
        unitPrice: { type: string, pattern: '^[0-9]+(\.[0-9]{1,2})?$' }
    Ims:
      type: object
      required: [id, projectId, name]
      properties:
        id: { $ref: '#/components/schemas/UUID' }
        projectId: { $ref: '#/components/schemas/UUID' }
        name: { type: string }
        currentBaselineRevisionId: { type: [string, 'null'], format: uuid }
    CreateImsRevision:
      type: object
      required: [revisionNumber]
      properties:
        revisionNumber: { type: integer, minimum: 1 }
        description: { type: string }
    CreateActivity:
      type: object
      required: [wbsNodeId, activityCode, title, durationDays, plannedStart, plannedFinish]
      additionalProperties: false
      properties:
        wbsNodeId: { $ref: '#/components/schemas/UUID' }
        activityCode: { type: string, minLength: 1 }
        title: { type: string, minLength: 1 }
        durationDays: { type: integer, minimum: 0 }
        plannedStart: { type: string, format: date }
        plannedFinish: { type: string, format: date }
        responsiblePartyId: { $ref: '#/components/schemas/UUID' }
    CreateDependency:
      type: object
      required: [predecessorId, successorId, linkType]
      additionalProperties: false
      properties:
        predecessorId: { $ref: '#/components/schemas/UUID' }
        successorId: { $ref: '#/components/schemas/UUID' }
        linkType: { type: string, enum: [FS, SS, FF, SF] }
        lagDays: { type: integer, default: 0 }
    TransferInitiation:
      type: object
      required: [newManagerAccountId, consentConfirmed]
      additionalProperties: false
      properties:
        newManagerAccountId: { $ref: '#/components/schemas/UUID' }
        consentConfirmed: { type: boolean, const: true }
        transferNote: { type: string, maxLength: 1000 }
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        requestId: { type: string }
