name: BAITNA V3.1 visual quality gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/baitna-v3-1.css'
      - 'assets/baitna-v3-1-motion.js'
      - 'index.html'
      - 'demo/**'
      - 'tests/ui-v3-1-*'
      - 'tests/ui-palette-audit.mjs'
      - 'tests/ui-brand-bidi-audit.mjs'
      - 'assets/favicon.svg'
      - 'assets/baitna-v3-nav.js'
      - '.github/workflows/baitna-v3-1-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preserve-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/ui-v3-1-smoke.test.cjs tests/ui-v3-redesign.test.cjs tests/ui-governance-lock.test.cjs tests/orb.test.cjs tests/ui-share-preview.test.cjs
  browser-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/ui-v3-1-browser.mjs
      - name: Audit typography, contrast and responsive surfaces
        run: node tests/ui-brand-visual-audit.mjs
      - name: Check unified earth palette across six screens
        run: node tests/ui-palette-audit.mjs
      - name: Verify logo and English / Arabic punctuation placement
        run: node tests/ui-brand-bidi-audit.mjs

      - name: Publish BAITNA visual audit captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baitna-v34-responsive-visuals
          path: |
            reports/ui-brand-v34/
            reports/ui-brand-palette/
            reports/ui-bidi-v36/
          if-no-files-found: warn
          retention-days: 30
