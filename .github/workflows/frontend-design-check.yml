name: Frontend design checks
on:
  pull_request:
    paths:
      - 'assets/baitna-design-system.css'
      - 'index.html'
      - 'demo/**'
      - 'tests/frontend-theme.test.cjs'
  push:
    branches: [main]
    paths:
      - 'assets/baitna-design-system.css'
      - 'index.html'
      - 'demo/**'
      - 'tests/frontend-theme.test.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static frontend integrity checks
        run: node --test tests/frontend-theme.test.cjs
